  <circle cx="430" cy="130" r="2.3" fill="#00d4ff" class="nb"/>
  <circle cx="430" cy="182" r="5.5" fill="#020a14" stroke="#00d4ff" stroke-opacity=".55" stroke-width="1.2"/>
  <circle cx="430" cy="182" r="2.3" fill="#00d4ff" class="nc"/>

  <!-- Hidden nodes -->
  <circle cx="497" cy="98"  r="5.5" fill="#020a14" stroke="#7c3aed" stroke-opacity=".5" stroke-width="1.2"/>
  <circle cx="497" cy="98"  r="2.3" fill="#a78bfa" class="nd"/>
  <circle cx="497" cy="143" r="5.5" fill="#020a14" stroke="#7c3aed" stroke-opacity=".55" stroke-width="1.2"/>
  <circle cx="497" cy="143" r="2.3" fill="#a78bfa" class="na"/>
  <circle cx="497" cy="188" r="5.5" fill="#020a14" stroke="#7c3aed" stroke-opacity=".5" stroke-width="1.2"/>
