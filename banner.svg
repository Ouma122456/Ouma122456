  <rect x="52"  y="178" width="58" height="19" rx="9.5" fill="#00d4ff" fill-opacity=".04" stroke="#00d4ff" stroke-opacity=".2" stroke-width=".7"/>
  <text x="81"  y="191.5" font-family="monospace" font-size="10" fill="#5fa0be" text-anchor="middle">MLflow</text>

  <rect x="116" y="178" width="56" height="19" rx="9.5" fill="#00d4ff" fill-opacity=".04" stroke="#00d4ff" stroke-opacity=".2" stroke-width=".7"/>
  <text x="144" y="191.5" font-family="monospace" font-size="10" fill="#5fa0be" text-anchor="middle">Qdrant</text>

