  <rect x="608" y="16" width="274" height="228" rx="13" fill="url(#glassR)" stroke="#6d28d9" stroke-opacity=".13" stroke-width=".8"/>
  <rect x="608" y="16" width="274" height="3"   rx="1.5" fill="#6d28d9" fill-opacity=".5"/>

