  <text x="153" y="166.5" font-family="monospace" font-size="10" fill="#00d4ff" text-anchor="middle">FastAPI</text>

  <rect x="190" y="153" width="50" height="19" rx="9.5" fill="#00d4ff" fill-opacity=".07" stroke="#00d4ff" stroke-opacity=".32" stroke-width=".7"/>
  <text x="215" y="166.5" font-family="monospace" font-size="10" fill="#00d4ff" text-anchor="middle">Kafka</text>

  <rect x="246" y="153" width="56" height="19" rx="9.5" fill="#6d28d9" fill-opacity=".11" stroke="#6d28d9" stroke-opacity=".38" stroke-width=".7"/>
  <text x="274" y="166.5" font-family="monospace" font-size="10" fill="#a78bfa" text-anchor="middle">Docker</text>

  <rect x="308" y="153" width="60" height="19" rx="9.5" fill="#6d28d9" fill-opacity=".11" stroke="#6d28d9" stroke-opacity=".38" stroke-width=".7"/>
  <text x="338" y="166.5" font-family="monospace" font-size="10" fill="#a78bfa" text-anchor="middle">K8s · ML</text>

