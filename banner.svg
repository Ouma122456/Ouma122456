<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="glow" cx="50%" cy="50%" r="55%">
    <stop offset="0%"   stop-color="#2e0d24" stop-opacity=".75"/>
    <stop offset="100%" stop-color="#0a0510" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Background -->
<rect width="900" height="260" fill="#0a0510"/>
<rect width="900" height="260" fill="url(#glow)"/>

<!-- Branch top-right (petals fall from here) -->
<path d="M 750,0 C 775,30 800,55 840,80" stroke="#6a3050" stroke-width="1.4" fill="none" stroke-opacity=".65"/>
<path d="M 840,80 C 860,65 882,55 900,50" stroke="#6a3050" stroke-width="1" fill="none" stroke-opacity=".55"/>
<path d="M 790,28 C 800,46 795,60 782,72" stroke="#6a3050" stroke-width=".9" fill="none" stroke-opacity=".5"/>

<!-- Static blossom on branch -->
<g transform="translate(842,44)">
  <path d="M 0,-10 C 4,-7 5,-1 0,2 C -5,-1 -4,-7 0,-10 Z" transform="rotate(0)"   fill="#ecb8d0" fill-opacity=".7"/>
  <path d="M 0,-10 C 4,-7 5,-1 0,2 C -5,-1 -4,-7 0,-10 Z" transform="rotate(72)"  fill="#ecb8d0" fill-opacity=".65"/>
  <path d="M 0,-10 C 4,-7 5,-1 0,2 C -5,-1 -4,-7 0,-10 Z" transform="rotate(144)" fill="#ecb8d0" fill-opacity=".7"/>
  <path d="M 0,-10 C 4,-7 5,-1 0,2 C -5,-1 -4,-7 0,-10 Z" transform="rotate(216)" fill="#ecb8d0" fill-opacity=".65"/>
  <path d="M 0,-10 C 4,-7 5,-1 0,2 C -5,-1 -4,-7 0,-10 Z" transform="rotate(288)" fill="#ecb8d0" fill-opacity=".7"/>
  <circle r="2.8" fill="#fce8f4" fill-opacity=".9"/>
</g>
<g transform="translate(878,55) scale(.7)">
  <path d="M 0,-10 C 4,-7 5,-1 0,2 C -5,-1 -4,-7 0,-10 Z" transform="rotate(20)"  fill="#d4789a" fill-opacity=".55"/>
  <path d="M 0,-10 C 4,-7 5,-1 0,2 C -5,-1 -4,-7 0,-10 Z" transform="rotate(92)"  fill="#d4789a" fill-opacity=".5"/>
  <path d="M 0,-10 C 4,-7 5,-1 0,2 C -5,-1 -4,-7 0,-10 Z" transform="rotate(164)" fill="#d4789a" fill-opacity=".55"/>
  <path d="M 0,-10 C 4,-7 5,-1 0,2 C -5,-1 -4,-7 0,-10 Z" transform="rotate(236)" fill="#d4789a" fill-opacity=".5"/>
  <path d="M 0,-10 C 4,-7 5,-1 0,2 C -5,-1 -4,-7 0,-10 Z" transform="rotate(308)" fill="#d4789a" fill-opacity=".55"/>
  <circle r="2.5" fill="#fce0ee" fill-opacity=".8"/>
</g>

<!-- ═══ ANIMATED FALLING PETALS ═══ -->
<!-- Petal: outer <g> animates translate (fall path), inner path animates rotation -->

<g><animateTransform attributeName="transform" type="translate" from="80 -15" to="108 275" dur="6s" repeatCount="indefinite" begin="0s"/>
<path d="M 0,-11 C 5,-7 6,0 0,3 C -6,0 -5,-7 0,-11 Z" fill="#d4789a" fill-opacity=".65">
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite" begin="0s"/></path></g>

<g><animateTransform attributeName="transform" type="translate" from="215 -15" to="190 275" dur="7.5s" repeatCount="indefinite" begin="1.2s"/>
<path d="M 0,-9 C 4,-5 5,0 0,2 C -5,0 -4,-5 0,-9 Z" fill="#e8a8c0" fill-opacity=".55" transform="scale(.8)">
<animateTransform attributeName="transform" type="rotate" from="30" to="390" dur="7.5s" repeatCount="indefinite" begin="1.2s"/></path></g>

<g><animateTransform attributeName="transform" type="translate" from="355 -15" to="382 275" dur="5.5s" repeatCount="indefinite" begin="2.4s"/>
<path d="M 0,-12 C 6,-8 7,0 0,3 C -7,0 -6,-8 0,-12 Z" fill="#c06880" fill-opacity=".6" transform="scale(1.1)">
<animateTransform attributeName="transform" type="rotate" from="-20" to="340" dur="5.5s" repeatCount="indefinite" begin="2.4s"/></path></g>

<g><animateTransform attributeName="transform" type="translate" from="490 -15" to="462 275" dur="6.8s" repeatCount="indefinite" begin="0.6s"/>
<path d="M 0,-10 C 5,-6 5,0 0,2 C -5,0 -5,-6 0,-10 Z" fill="#f0c0dc" fill-opacity=".5" transform="scale(.85)">
<animateTransform attributeName="transform" type="rotate" from="15" to="375" dur="6.8s" repeatCount="indefinite" begin="0.6s"/></path></g>

<g><animateTransform attributeName="transform" type="translate" from="625 -15" to="650 275" dur="7.2s" repeatCount="indefinite" begin="1.8s"/>
<path d="M 0,-11 C 5,-7 6,0 0,3 C -6,0 -5,-7 0,-11 Z" fill="#d4789a" fill-opacity=".6" transform="scale(.9)">
<animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="7.2s" repeatCount="indefinite" begin="1.8s"/></path></g>

<g><animateTransform attributeName="transform" type="translate" from="765 -15" to="742 275" dur="6.2s" repeatCount="indefinite" begin="3.1s"/>
<path d="M 0,-9 C 4,-5 5,0 0,2 C -5,0 -4,-5 0,-9 Z" fill="#e8a8c0" fill-opacity=".58">
<animateTransform attributeName="transform" type="rotate" from="-30" to="330" dur="6.2s" repeatCount="indefinite" begin="3.1s"/></path></g>

<g><animateTransform attributeName="transform" type="translate" from="160 -15" to="132 275" dur="5s" repeatCount="indefinite" begin="4.2s"/>
<path d="M 0,-12 C 6,-8 7,0 0,3 C -7,0 -6,-8 0,-12 Z" fill="#c06880" fill-opacity=".55" transform="scale(1.2)">
<animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="5s" repeatCount="indefinite" begin="4.2s"/></path></g>

<g><animateTransform attributeName="transform" type="translate" from="710 -15" to="736 275" dur="7s" repeatCount="indefinite" begin="0.9s"/>
<path d="M 0,-10 C 5,-6 5,0 0,2 C -5,0 -5,-6 0,-10 Z" fill="#f0c0dc" fill-opacity=".52" transform="scale(.8)">
<animateTransform attributeName="transform" type="rotate" from="10" to="370" dur="7s" repeatCount="indefinite" begin="0.9s"/></path></g>

<g><animateTransform attributeName="transform" type="translate" from="285 -15" to="260 275" dur="6.4s" repeatCount="indefinite" begin="3.6s"/>
<path d="M 0,-11 C 5,-7 6,0 0,3 C -6,0 -5,-7 0,-11 Z" fill="#d4789a" fill-opacity=".5" transform="scale(.75)">
<animateTransform attributeName="transform" type="rotate" from="-45" to="315" dur="6.4s" repeatCount="indefinite" begin="3.6s"/></path></g>

<g><animateTransform attributeName="transform" type="translate" from="855 -15" to="875 275" dur="5.8s" repeatCount="indefinite" begin="2s"/>
<path d="M 0,-9 C 4,-5 5,0 0,2 C -5,0 -4,-5 0,-9 Z" fill="#e8a8c0" fill-opacity=".55" transform="scale(.85)">
<animateTransform attributeName="transform" type="rotate" from="25" to="385" dur="5.8s" repeatCount="indefinite" begin="2s"/></path></g>

<g><animateTransform attributeName="transform" type="translate" from="50 -15" to="28 275" dur="7.8s" repeatCount="indefinite" begin="2.7s"/>
<path d="M 0,-10 C 5,-6 5,0 0,2 C -5,0 -5,-6 0,-10 Z" fill="#c06880" fill-opacity=".48" transform="scale(1.1)">
<animateTransform attributeName="transform" type="rotate" from="-10" to="350" dur="7.8s" repeatCount="indefinite" begin="2.7s"/></path></g>

<g><animateTransform attributeName="transform" type="translate" from="440 -15" to="458 275" dur="8.5s" repeatCount="indefinite" begin="5s"/>
<path d="M 0,-11 C 5,-7 6,0 0,3 C -6,0 -5,-7 0,-11 Z" fill="#f0c0dc" fill-opacity=".45" transform="scale(.7)">
<animateTransform attributeName="transform" type="rotate" from="55" to="415" dur="8.5s" repeatCount="indefinite" begin="5s"/></path></g>

<!-- ══ TEXT ══ -->
<text x="450" y="90" text-anchor="middle"
      font-family="'Courier New',Courier,monospace"
      font-size="13" fill="#7a4060" letter-spacing="1">Hello, I'm</text>

<text x="450" y="140" text-anchor="middle"
      font-family="Georgia,'Times New Roman',serif"
      font-size="44" font-weight="700" fill="#f0d8e8" letter-spacing=".3">Oumayma Abassi</text>

<text x="450" y="170" text-anchor="middle"
      font-family="'Courier New',Courier,monospace"
      font-size="12.5" fill="#b07090" letter-spacing="2">AI Engineer  &amp;  Data Engineer</text>

<line x1="330" y1="186" x2="570" y2="186" stroke="#c06880" stroke-opacity=".2" stroke-width=".6"/>

<text x="450" y="208" text-anchor="middle"
      font-family="Georgia,serif"
      font-size="14" fill="#5a3048" font-style="italic">Turning data into intelligence.</text>

</svg>
