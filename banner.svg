  <line x1="497" y1="143" x2="564" y2="130" stroke="#a78bfa" stroke-width="1.2" stroke-opacity=".9" class="fl2"/>
  <line x1="430" y1="78"  x2="497" y2="98"  stroke="#00d4ff" stroke-width="1.0" stroke-opacity=".8" class="fl3"/>

  <!-- Input nodes -->
