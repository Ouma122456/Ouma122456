  <line x1="430" y1="78"  x2="497" y2="143" stroke="#00d4ff" stroke-opacity=".07" stroke-width=".7"/>
  <line x1="430" y1="78"  x2="497" y2="188" stroke="#00d4ff" stroke-opacity=".05" stroke-width=".7"/>
  <line x1="430" y1="130" x2="497" y2="98"  stroke="#00d4ff" stroke-opacity=".09" stroke-width=".7"/>
  <line x1="430" y1="130" x2="497" y2="143" stroke="#00d4ff" stroke-opacity=".14" stroke-width=".7"/>
  <line x1="430" y1="130" x2="497" y2="188" stroke="#00d4ff" stroke-opacity=".07" stroke-width=".7"/>
  <line x1="430" y1="182" x2="497" y2="98"  stroke="#00d4ff" stroke-opacity=".05" stroke-width=".7"/>
  <line x1="430" y1="182" x2="497" y2="143" stroke="#00d4ff" stroke-opacity=".09" stroke-width=".7"/>
