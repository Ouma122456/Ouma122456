<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes pulse   { 0%,100%{opacity:.45} 50%{opacity:1} }
      @keyframes pulse2  { 0%,100%{opacity:.35} 50%{opacity:.9} }
      @keyframes flow    { 0%{stroke-dashoffset:140;opacity:0} 30%{opacity:.85} 100%{stroke-dashoffset:0;opacity:0} }
      @keyframes flow2   { 0%{stroke-dashoffset:120;opacity:0} 40%{opacity:.75} 100%{stroke-dashoffset:0;opacity:0} }
      @keyframes glow-bg { 0%,100%{fill-opacity:.05} 50%{fill-opacity:.11} }
      .na{animation:pulse  2.4s ease-in-out infinite}
      .nb{animation:pulse  3s   ease-in-out infinite .5s}
      .nc{animation:pulse  2.8s ease-in-out infinite 1s}
      .nd{animation:pulse2 2.6s ease-in-out infinite .3s}
      .ne{animation:pulse2 3.2s ease-in-out infinite .8s}
      .fl {stroke-dasharray:65 75;animation:flow  2.9s linear infinite}
      .fl2{stroke-dasharray:55 85;animation:flow2 3.5s linear infinite .8s}
      .fl3{stroke-dasharray:75 65;animation:flow  3.1s linear infinite 1.6s}
      .gb{animation:glow-bg 4s ease-in-out infinite}
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#020a14"/>
      <stop offset="55%"  stop-color="#040d1e"/>
      <stop offset="100%" stop-color="#020a14"/>
    </linearGradient>
    <linearGradient id="glassL" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".065"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".015"/>
    </linearGradient>
    <linearGradient id="glassR" x1="1" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#6d28d9" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".015"/>
    </linearGradient>
    <radialGradient id="cg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sg">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <line x1="0" y1="65"  x2="900" y2="65"  stroke="#ffffff" stroke-opacity=".022" stroke-width=".5"/>
  <line x1="0" y1="130" x2="900" y2="130" stroke="#ffffff" stroke-opacity=".022" stroke-width=".5"/>
  <line x1="0" y1="195" x2="900" y2="195" stroke="#ffffff" stroke-opacity=".022" stroke-width=".5"/>
  <line x1="225" y1="0" x2="225" y2="260" stroke="#ffffff" stroke-opacity=".022" stroke-width=".5"/>
  <line x1="450" y1="0" x2="450" y2="260" stroke="#ffffff" stroke-opacity=".022" stroke-width=".5"/>
  <line x1="675" y1="0" x2="675" y2="260" stroke="#ffffff" stroke-opacity=".022" stroke-width=".5"/>

  <!-- ─── LEFT GLASS PANEL ─── -->
  <rect x="18" y="16" width="375" height="228" rx="13" fill="url(#glassL)" stroke="#00d4ff" stroke-opacity=".11" stroke-width=".8"/>
  <rect x="18" y="16" width="3"   height="228" rx="1.5" fill="#00d4ff" fill-opacity=".6"/>

  <!-- Name -->
  <text x="52" y="70" font-family="Georgia,'Times New Roman',serif" font-size="31" font-weight="700" fill="#edf3ff" letter-spacing=".4">Oumayma Abassi</text>

